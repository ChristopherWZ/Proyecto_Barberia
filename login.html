<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <section class="seccion-login">
        <!--Columna de bienvenida-->

        <div class="container row">
            <div class="col-md-6">
                <div class="mensaje-bienvenida">
                    <h1>Bienvenido</h1>
                    <h3>
                        Este sistema te brindara la herramienta para añadir, modificar y eliminar para el negocio de la barberia.
                    </h3>
                </div>
            </div>
            <!--Fin Columna de bienvenida-->

            <div class="caja-login col-md-6">

                <div class="row sign-in">
                    <h2>Sign in</h2>
                </div>

                <div class="row">
                    <label for="inputUserEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="inputUserEmail">

                </div>

                <div class="row pass">
                    <label for="inputUserPass" class="form-label">Password</label>
                    <input type="password" class="form-control" id="inputUserPass">
                </div>

                <div class="row login-Functions">
                    <div class="col-md-6 loginbtn">

                        <button type="submit" class="btn btn-warning">Subir Cliente</button>

                    </div>

                    <div class="col-md-6 subsctiptionbtn">
                        <a class="icon-link" href="subscription.html">
                            Create your account
                            <svg xmlns="http://www.w3.org/2000/svg" class="bi" viewBox="0 0 16 16" aria-hidden="true">
                                <path
                                    d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8z" />
                            </svg>

                        </a>


                    </div>


                </div>


            </div>
        </div>



    </section>


</body>

</html>
