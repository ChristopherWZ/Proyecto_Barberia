<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="login.css">
</head>

  <body>

    <section class="seccion-login">
        <div class="container login ">

            <div class="caja-login">

            <div class="row">
                <label for="inputUserName" class="form-label">Nombre</label>
                <input type="email" class="form-control" id="inputUserName">

            </div>
            
            <div class="row">
                <label for="inputUserP-Ape" class="form-label">Primer Apellido</label>
                <input type="email" class="form-control" id="inputUserP-Ape">

            </div>

            <div class="row">
                <label for="inputUserNumber" class="form-label">Numero</label>
                <input type="email" class="form-control" id="inputUserNumber">

            </div>

            <div class="row">
                <label for="inputUserS-Ape" class="form-label">Segundo Apellido</label>
                <input type="email" class="form-control" id="inputUserS-Ape">

            </div>

            <div class="row">
                <label for="inputUserEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="inputUserEmail">

            </div>

            <div class="row pass">
                <label for="inputUserPass" class="form-label">Password</label>
                <input type="email" class="form-control" id="inputUserPass">
            </div>

            

            <div class="row login-Functions">
                <div class="col-md-6 loginbtn">

                <button type="submit" class="btn btn-warning">Create account</button>

                </div>


            </div>

            

            </div>

            


        </div>


    </section>

   
  </body>
</html>
